# HX-CentCom DEV/TEST route. Dedicated port; the port-80 server in nginx.conf is not changed.
# Owner authorization: https://github.com/HX-Infratstructure/HX-CentCom/issues/1#issuecomment-6875640539.
server {
    listen 8420;
    server_name _;

    location / {
        proxy_pass http://192.168.50.215:5420;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
